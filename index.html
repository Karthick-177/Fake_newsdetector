<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fake News Detector</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0f0f0f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 620px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    textarea {
      width: 100%;
      height: 180px;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      padding: 14px;
      resize: vertical;
      outline: none;
      transition: border 0.2s;
    }

    textarea:focus { border-color: #555; }

    textarea::placeholder { color: #444; }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background: #ffffff;
      color: #000;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #ddd; }
    button:disabled { background: #444; color: #888; cursor: not-allowed; }

    .result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }

    .result.fake {
      background: rgba(255, 60, 60, 0.1);
      border: 1px solid rgba(255, 60, 60, 0.3);
    }

    .result.real {
      background: rgba(60, 220, 120, 0.1);
      border: 1px solid rgba(60, 220, 120, 0.3);
    }

    .result .label {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .result.fake .label { color: #ff4444; }
    .result.real .label { color: #3ddc84; }

    .result .confidence {
      font-size: 0.95rem;
      color: #aaa;
    }

    .spinner {
      display: none;
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔍 Fake News Detector</h1>
    <p class="subtitle">Paste any news article or headline to check if it's real or fake.</p>

    <textarea id="newsText" placeholder="Paste your news article or headline here..."></textarea>

    <button id="checkBtn" onclick="checkNews()">Check News</button>

    <div class="spinner" id="spinner">⏳ Analyzing...</div>

    <div class="result" id="result">
      <div class="label" id="resultLabel"></div>
      <div class="confidence" id="resultConfidence"></div>
    </div>
  </div>

  <script>
    async function checkNews() {
      const text = document.getElementById("newsText").value.trim();
      if (!text) { alert("Please paste some news text first!"); return; }

      const btn     = document.getElementById("checkBtn");
      const spinner = document.getElementById("spinner");
      const result  = document.getElementById("result");

      btn.disabled      = true;
      spinner.style.display = "block";
      result.style.display  = "none";

      try {
        const response = await fetch("http://127.0.0.1:8000/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });

        const data = await response.json();

        result.className = "result " + data.prediction.toLowerCase();
        document.getElementById("resultLabel").textContent =
          data.prediction === "Fake" ? "🔴 FAKE NEWS" : "🟢 REAL NEWS";
        document.getElementById("resultConfidence").textContent =
          `Confidence: ${data.confidence}`;

        result.style.display = "block";
      } catch (err) {
        alert("Error: Make sure the API is running on http://127.0.0.1:8000");
      } finally {
        btn.disabled = false;
        spinner.style.display = "none";
      }
    }
  </script>
</body>
</html>
